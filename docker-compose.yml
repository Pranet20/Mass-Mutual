version: '3.8'

services:
  app:
    build: .
    container_name: travel_intelligence_app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-travel_prod_secure_pass}@db:5432/${POSTGRES_DB:-travel_analytics}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: travel_intelligence_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_prod_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-travel_analytics}
    ports:
      - "${PG_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
